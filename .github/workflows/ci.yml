name: ci

# Gate: lint clean and the test suite passes. This server holds a Garmin
# session and is deliberately read-only, so the tests that assert "no write
# tool is exposed" are the ones worth protecting.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest tests -q

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "garmin-athletics-mcp"
version = "0.1.0"
description = "Private, read-only Garmin athletics MCP server for local AI clients"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "garminconnect[typed]==0.3.6",
  "mcp[cli]>=1.27,<2",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
garmin-athletics-mcp = "garmin_mcp.server:main"
garmin-athletics-admin = "garmin_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

